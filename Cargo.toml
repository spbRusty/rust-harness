[package]
name = "rust-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Small local LLM harness with Ollama, native tools, and MCP stdio support"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
